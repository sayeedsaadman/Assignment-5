<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Issues Tracker</title>

    <link rel="stylesheet" href="style.css">

    <!-- favicon -->
    <link
      rel="shortcut icon"
      href="./assets/github-logo.png"
      type="image/x-icon"
    />

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Daisy Ui -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body class="bg-base-200">
    <!-- Login Section -->
    <section
      id="login-section"
      class="min-h-screen flex justify-center items-center px-4"
    >
      <div class="bg-white w-full max-w-xl rounded-2xl shadow-lg p-8">
        <div class="text-center space-y-3 mb-8">
          <div class="w-20 h-20 rounded-full items-center mx-auto">
            <img src="./assets/github-logo.png" alt="GitHub Logo" />
          </div>
          <h1 class="text-4xl font-bold">GitHub Issues Tracker</h1>
          <p class="text-gray-500">Sign in to manage your issues</p>
        </div>

        <form id="login-form" class="space-y-4">
          <div>
            <label class="label font-semibold">Username</label>
            <input
              id="username"
              type="text"
              placeholder="Enter Username"
              class="input input-bordered w-full"
            />
          </div>

          <div>
            <label class="label font-semibold">Password</label>
            <input
              id="password"
              type="password"
              placeholder="Enter Password"
              class="input input-bordered w-full"
            />
          </div>

          <p id="login-error" class="text-red-500 text-sm"></p>

          <button
            id="login-btn"
            type="submit"
            class="btn btn-primary w-full mt-3"
          >
            Sign In
          </button>
        </form>

        <div class="divider">OR</div>

        <div class="bg-slate-100 rounded-xl p-5 text-center">
          <p class="text-gray-500 mb-2">Demo Credentials</p>
          <p class="font-semibold">Username: admin</p>
          <p class="font-semibold">Password: admin123</p>
        </div>
      </div>
    </section>

    <!-- Main Section -->
    <section id="main-section" class="hidden">
      <!-- Navbar -->
      <section class="bg-white shadow-sm">
        <div
          class="w-11/12 mx-auto py-4 flex flex-col md:flex-row gap-4 justify-between items-center"
        >
          <div class="flex items-center gap-2">
            <img
              src="./assets/github-logo.png"
              alt="GitHub Logo"
              class="max-h-[40px]"
            />
            <h2 class="text-2xl font-bold">GitHub Issues Tracker</h2>
          </div>

          <div class="flex gap-2 w-full md:w-auto">
            <input
              id="input-search"
              type="text"
              placeholder="Search issue "
              class="input input-bordered w-full md:w-80"
            />
            <button id="btn-search" type="button" class="btn btn-primary">
              Search
            </button>
          </div>
        </div>
      </section>

      <main class="w-11/12 mx-auto py-8">
        <!-- Tabs -->
        <section class="mb-6">
          <div class="flex gap-3 flex-wrap">
            <button
              onclick="loadAllIssues()"
              id="tab-all"
              type="button"
              class="btn btn-primary tab-btn"
            >
              All
            </button>

            <button
              onclick="loadOpenIssues()"
              id="tab-open"
              type="button"
              class="btn btn-outline btn-primary tab-btn"
            >
              Open
            </button>

            <button
              onclick="loadClosedIssues()"
              id="tab-closed"
              type="button"
              class="btn btn-outline btn-primary tab-btn"
            >
              Closed
            </button>
          </div>
        </section>

        <!-- Summary -->
        <section class="bg-white rounded-xl p-5 shadow-sm mb-6">
          <div
            class="flex flex-col md:flex-row gap-4 justify-between items-center"
          >
            <div class="flex items-center gap-4">
              <div
                class="w-12 h-12 rounded-full bg-violet-100 flex justify-center items-center"
              >
                <img src="./assets/Aperture.png" alt="Aperture Icon" />
              </div>
              <div>
                <h2 class="font-bold text-2xl">
                  <span id="issue-count">0</span> Issues
                </h2>
                <p class="text-gray-500 text-sm">
                  Track and manage your project issues
                </p>
              </div>
            </div>

            <div class="flex items-center gap-6 text-sm">
              <div class="flex items-center gap-2">
                <span
                  class="w-3 h-3 rounded-full bg-green-500 inline-block"
                ></span>
                Open
              </div>
              <div class="flex items-center gap-2">
                <span
                  class="w-3 h-3 rounded-full bg-violet-500 inline-block"
                ></span>
                Closed
              </div>
            </div>
          </div>
        </section>

        <!-- Spinner -->
        <section
          id="spinner"
          class="flex justify-center items-center py-10 hidden"
        >
          <span class="loading loading-bars loading-xl"></span>
        </section>

        <!-- Issues Container -->
        <section
          id="issues-container"
          class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5"
        >
          <div
            class="col-span-full text-center bg-white rounded-xl py-16 space-y-4"
          >
            <p class="text-gray-400 text-xl">No issues loaded yet</p>
          </div>
        </section>
      </main>
    </section>

    <!-- Modal -->
    <dialog id="issue_modal" class="modal modal-bottom sm:modal-middle">
      <div class="modal-box max-w-2xl">
        <div id="details-container" class="space-y-4"></div>
        <div class="modal-action">
          <form method="dialog">
            <button class="btn" type="submit">Close</button>
          </form>
        </div>
      </div>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
